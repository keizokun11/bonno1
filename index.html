<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>煩悩オークション</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #130b08;
      --panel: rgba(255, 255, 255, 0.08);
      --panel-strong: rgba(255, 255, 255, 0.14);
      --text: #fff8ee;
      --muted: rgba(255, 248, 238, 0.72);
      --accent: #f0a23a;
      --danger: #ef5b3b;
      --ok: #74d680;
      --border: rgba(255, 255, 255, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 124, 37, 0.18), transparent 36%),
        radial-gradient(circle at 10% 10%, rgba(242, 196, 102, 0.08), transparent 28%),
        linear-gradient(135deg, #0c0706, #1e100b 46%, #050505);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    a { color: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 6, 5, 0.78);
      backdrop-filter: blur(12px);
    }

    .brand {
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav a {
      text-decoration: none;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 13px;
    }

    .wrap {
      width: min(1080px, 92vw);
      margin: 0 auto;
      padding: 28px 0 70px;
    }

    .hero {
      text-align: center;
      padding: 36px 0 22px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 72px);
      letter-spacing: 0.08em;
      line-height: 1.15;
    }

    .hero p {
      margin: 14px auto 0;
      color: var(--muted);
      max-width: 720px;
      line-height: 1.8;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.22);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .nav { justify-content: flex-start; }
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border-radius: 14px;
      padding: 14px 15px;
      font: inherit;
      outline: none;
    }

    select option { color: #111; }

    textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.7;
    }

    .form-row { margin-bottom: 16px; }

    .hint, .status-line {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button, .link-button {
      appearance: none;
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      color: #201008;
      background: var(--accent);
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
    }

    button.secondary { background: rgba(255,255,255,0.16); color: var(--text); border: 1px solid var(--border); }
    button.danger { background: var(--danger); color: #fff; }
    button.ok { background: var(--ok); color: #051107; }
    button:disabled { opacity: 0.52; cursor: not-allowed; }

    .section-title {
      margin: 28px 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 22px;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .item {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.07);
      border-radius: 18px;
      padding: 14px;
    }

    .item-main {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .item-meta {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      margin-right: 4px;
    }

    .screen-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .screen-card {
      width: min(1200px, 94vw);
      text-align: center;
      padding: 30px;
    }

    .screen-label {
      color: var(--muted);
      font-size: clamp(20px, 3vw, 36px);
      letter-spacing: 0.18em;
      margin-bottom: 34px;
    }

    .screen-text {
      font-size: clamp(48px, 9vw, 126px);
      line-height: 1.22;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-shadow: 0 0 20px rgba(255, 174, 58, 0.55), 0 0 60px rgba(255, 86, 32, 0.22);
      white-space: pre-wrap;
      transition: all 0.45s ease;
    }

    .screen-meta {
      margin-top: 32px;
      color: var(--muted);
      font-size: clamp(18px, 2.4vw, 30px);
    }

    .burning-text {
      animation: burnText 4.2s forwards ease-in-out;
    }

    @keyframes burnText {
      0% {
        opacity: 1;
        color: #fffdf5;
        transform: scale(1);
        filter: blur(0);
        text-shadow: 0 0 22px rgba(255, 187, 72, 0.85);
      }
      28% {
        color: #ffd17a;
        transform: scale(1.06);
        text-shadow: 0 0 34px rgba(255, 204, 78, 1), 0 0 86px rgba(255, 72, 0, 0.92);
      }
      64% {
        color: #43200b;
        opacity: 0.7;
        transform: scale(0.99) rotate(-0.8deg);
        filter: blur(1.8px);
      }
      100% {
        opacity: 0;
        color: #090909;
        transform: translateY(-90px) scale(0.88) rotate(1.2deg);
        filter: blur(9px);
      }
    }

    .flame {
      position: fixed;
      left: 0;
      bottom: -70px;
      width: 100%;
      height: 300px;
      opacity: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 20% 85%, rgba(255, 197, 64, 0.78), transparent 28%),
        radial-gradient(ellipse at 46% 85%, rgba(255, 70, 15, 0.78), transparent 34%),
        radial-gradient(ellipse at 76% 85%, rgba(255, 145, 31, 0.78), transparent 28%),
        linear-gradient(to top, rgba(255, 58, 0, 0.92), rgba(255, 190, 58, 0.46), transparent 78%);
      filter: blur(0.2px);
    }

    .flame.active {
      animation: flameUp 4.2s forwards ease-in-out;
    }

    @keyframes flameUp {
      0% { opacity: 0; transform: translateY(100px) scaleY(0.7); }
      30% { opacity: 1; transform: translateY(0) scaleY(1.1); }
      72% { opacity: 0.76; transform: translateY(-70px) scaleY(1.25); }
      100% { opacity: 0; transform: translateY(-160px) scaleY(0.9); }
    }

    .purified {
      margin-top: 34px;
      font-size: clamp(28px, 5vw, 64px);
      font-weight: 900;
      letter-spacing: 0.1em;
      opacity: 0;
    }

    .purified.show {
      animation: showPurified 4.2s forwards;
    }

    @keyframes showPurified {
      0%, 64% { opacity: 0; transform: translateY(16px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .empty {
      padding: 22px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 18px;
      text-align: center;
    }

    .setup-warning {
      border: 1px solid rgba(255, 91, 58, 0.6);
      background: rgba(255, 91, 58, 0.12);
      padding: 18px;
      border-radius: 18px;
      line-height: 1.75;
      margin-top: 18px;
    }

    code {
      background: rgba(255,255,255,0.12);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px 6px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // ここにSupabaseの値を入れてください。
    const SUPABASE_URL = "https://cyijtoldbcypgytrunrh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ria1SUzaGXmEO2bRvPgJQA_SD6RrU-f";

    const categories = ["お金", "恋愛", "承認欲求", "怠惰", "食欲", "将来不安", "その他"];
    let client = null;
    let appState = {
      bonnos: [],
      displayState: { id: 1, current_bonno_id: null, mode: "idle", updated_at: null },
      currentBonno: null,
      loading: false,
      message: ""
    };

    const root = document.getElementById("root");
    const route = getRoute();

    function getRoute() {
      const path = location.pathname.replace(/^\//, "").split("/")[0];
      if (["submit", "admin", "screen"].includes(path)) return path;
      return "home";
    }

    function isConfigured() {
      return SUPABASE_URL.startsWith("https://") && SUPABASE_ANON_KEY.length > 40;
    }

    function initClient() {
      if (!isConfigured()) return null;
      if (!client) client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      return client;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function topbar() {
      return `
        <div class="topbar">
          <div class="brand">煩悩オークション</div>
          <div class="nav">
            <a href="/submit">投稿</a>
            <a href="/admin">運営</a>
            <a href="/screen">スクリーン</a>
          </div>
        </div>
      `;
    }

    function setupWarning() {
      return `
        <div class="setup-warning">
          <strong>Supabase設定がまだです。</strong><br>
          <code>index.html</code> の上部にある <code>SUPABASE_URL</code> と <code>SUPABASE_ANON_KEY</code> を、Supabaseの値に置き換えてください。<br>
          置き換え後にGitHubへ再アップロードし、Vercelで再デプロイすると複数端末で連動します。
        </div>
      `;
    }

    function renderHome() {
      root.innerHTML = `
        ${topbar()}
        <main class="wrap">
          <section class="hero">
            <h1>煩悩オークション</h1>
            <p>参加者のスマホ投稿、運営画面、会場スクリーンをSupabaseでリアルタイム連動します。</p>
          </section>
          <div class="card">
            <div class="button-row">
              <a class="link-button" href="/submit">投稿画面へ</a>
              <a class="link-button" href="/admin">運営画面へ</a>
              <a class="link-button" href="/screen">スクリーンへ</a>
            </div>
            ${isConfigured() ? "" : setupWarning()}
          </div>
        </main>
      `;
    }

    function renderSubmit() {
      root.innerHTML = `
        ${topbar()}
        <main class="wrap">
          <section class="hero">
            <h1>あなたの煩悩を<br>差し出してください</h1>
            <p>匿名投稿できます。個人名、誹謗中傷、差別的表現、過度に不快な内容は表示されません。</p>
          </section>

          <section class="card">
            ${isConfigured() ? "" : setupWarning()}
            <form id="submit-form">
              <div class="form-row">
                <label for="bonno-text">煩悩本文 50文字以内</label>
                <textarea id="bonno-text" maxlength="50" placeholder="例：楽して単位がほしい" required></textarea>
                <div class="hint"><span id="counter">0</span>/50</div>
              </div>
              <div class="grid">
                <div class="form-row">
                  <label for="category">カテゴリ</label>
                  <select id="category">
                    ${categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("")}
                  </select>
                </div>
                <div class="form-row">
                  <label for="nickname">ニックネーム 任意</label>
                  <input id="nickname" maxlength="20" placeholder="未入力でもOK" />
                </div>
              </div>
              <div class="button-row">
                <button type="submit" id="submit-button">投稿する</button>
                <span class="status-line" id="submit-message"></span>
              </div>
            </form>
          </section>
        </main>
      `;

      const text = document.getElementById("bonno-text");
      const counter = document.getElementById("counter");
      text.addEventListener("input", () => counter.textContent = text.value.length);
      document.getElementById("submit-form").addEventListener("submit", handleSubmit);
    }

    async function handleSubmit(event) {
      event.preventDefault();
      const db = initClient();
      const message = document.getElementById("submit-message");
      const button = document.getElementById("submit-button");
      if (!db) {
        message.textContent = "Supabase設定が必要です。";
        return;
      }

      const text = document.getElementById("bonno-text").value.trim();
      const category = document.getElementById("category").value;
      const nickname = document.getElementById("nickname").value.trim();

      if (!text) return;
      if (text.length > 50) {
        message.textContent = "50文字以内で入力してください。";
        return;
      }

      button.disabled = true;
      message.textContent = "投稿中...";
      const { error } = await db.from("bonnos").insert({ text, category, nickname, status: "pending" });
      button.disabled = false;

      if (error) {
        message.textContent = "投稿に失敗しました：" + error.message;
        return;
      }

      document.getElementById("submit-form").reset();
      document.getElementById("counter").textContent = "0";
      message.textContent = "投稿しました。運営の承認後に表示されます。";
    }

    function renderAdmin() {
      const pending = appState.bonnos.filter(b => b.status === "pending");
      const approved = appState.bonnos.filter(b => b.status === "approved");
      const burned = appState.bonnos.filter(b => b.status === "burned").slice(0, 10);
      const current = appState.currentBonno;
      const mode = appState.displayState?.mode || "idle";

      root.innerHTML = `
        ${topbar()}
        <main class="wrap">
          <section class="hero">
            <h1>運営画面</h1>
            <p>承認、表示、燃やす操作をここで行います。会場スクリーンはリアルタイムで反応します。</p>
          </section>
          ${isConfigured() ? "" : setupWarning()}

          <section class="card">
            <div class="section-title">
              <h2>現在表示中</h2>
              <span class="badge">mode: ${escapeHtml(mode)}</span>
            </div>
            ${current ? `
              <div class="item">
                <div class="item-main">${escapeHtml(current.text)}</div>
                <div class="item-meta">${escapeHtml(current.category || "未分類")} / ${escapeHtml(current.nickname || "匿名")}</div>
                <div class="button-row">
                  <button class="danger" data-action="burn-current">燃やす</button>
                  <button class="ok" data-action="finish-current">浄化完了</button>
                  <button class="secondary" data-action="next">次へ</button>
                </div>
              </div>
            ` : `<div class="empty">まだ何も表示されていません。</div>`}
          </section>

          <section>
            <div class="section-title">
              <h2>承認待ち</h2>
              <span class="badge">${pending.length}件</span>
            </div>
            <div class="list">${pending.length ? pending.map(itemHtml).join("") : `<div class="empty">承認待ちはありません。</div>`}</div>
          </section>

          <section>
            <div class="section-title">
              <h2>承認済み</h2>
              <span class="badge">${approved.length}件</span>
            </div>
            <div class="list">${approved.length ? approved.map(itemHtml).join("") : `<div class="empty">承認済みはありません。</div>`}</div>
          </section>

          <section>
            <div class="section-title">
              <h2>燃焼済み</h2>
              <span class="badge">最新10件</span>
            </div>
            <div class="list">${burned.length ? burned.map(burnedHtml).join("") : `<div class="empty">燃焼済みはまだありません。</div>`}</div>
          </section>
        </main>
      `;

      document.body.onclick = handleAdminClick;
    }

    function itemHtml(b) {
      const created = b.created_at ? new Date(b.created_at).toLocaleString("ja-JP") : "";
      return `
        <div class="item">
          <div class="item-main">${escapeHtml(b.text)}</div>
          <div class="item-meta">
            <span class="badge">${escapeHtml(b.status)}</span>
            <span>${escapeHtml(b.category || "未分類")}</span>
            <span> / ${escapeHtml(b.nickname || "匿名")}</span>
            <span> / ${escapeHtml(created)}</span>
          </div>
          <div class="button-row">
            ${b.status === "pending" ? `
              <button class="ok" data-action="approve" data-id="${b.id}">承認</button>
              <button class="danger" data-action="reject" data-id="${b.id}">NG</button>
            ` : ""}
            ${b.status === "approved" ? `
              <button data-action="show" data-id="${b.id}">表示する</button>
              <button class="danger" data-action="burn" data-id="${b.id}">表示して燃やす</button>
              <button class="secondary" data-action="mark-burned" data-id="${b.id}">燃焼済みにする</button>
            ` : ""}
          </div>
        </div>
      `;
    }

    function burnedHtml(b) {
      return `
        <div class="item">
          <div class="item-main">${escapeHtml(b.text)}</div>
          <div class="item-meta">${escapeHtml(b.category || "未分類")} / ${escapeHtml(b.nickname || "匿名")}</div>
        </div>
      `;
    }

    async function handleAdminClick(event) {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const db = initClient();
      if (!db) return;

      const action = button.dataset.action;
      const id = button.dataset.id;
      button.disabled = true;

      try {
        if (action === "approve") await updateBonno(id, { status: "approved" });
        if (action === "reject") await updateBonno(id, { status: "rejected" });
        if (action === "show") await showBonno(id, "showing");
        if (action === "burn") await showBonno(id, "burning");
        if (action === "mark-burned") await updateBonno(id, { status: "burned" });
        if (action === "burn-current") await updateDisplay({ mode: "burning" });
        if (action === "finish-current") await finishCurrent();
        if (action === "next") await showNext();
      } finally {
        button.disabled = false;
        await loadAdminData();
        renderAdmin();
      }
    }

    async function updateBonno(id, patch) {
      const db = initClient();
      const { error } = await db.from("bonnos").update(patch).eq("id", id);
      if (error) alert(error.message);
    }

    async function updateDisplay(patch) {
      const db = initClient();
      const { error } = await db.from("display_state").update({ ...patch, updated_at: new Date().toISOString() }).eq("id", 1);
      if (error) alert(error.message);
    }

    async function showBonno(id, mode) {
      await updateDisplay({ current_bonno_id: id, mode });
    }

    async function finishCurrent() {
      const currentId = appState.displayState?.current_bonno_id;
      if (currentId) await updateBonno(currentId, { status: "burned" });
      await updateDisplay({ mode: "finished" });
    }

    async function showNext() {
      const next = appState.bonnos.find(b => b.status === "approved" && b.id !== appState.displayState?.current_bonno_id);
      if (!next) {
        alert("次の承認済み煩悩がありません。");
        return;
      }
      await showBonno(next.id, "showing");
    }

    async function loadAdminData() {
      const db = initClient();
      if (!db) return;
      const [{ data: bonnos, error: bonnosError }, { data: display, error: displayError }] = await Promise.all([
        db.from("bonnos").select("*").order("created_at", { ascending: false }),
        db.from("display_state").select("*").eq("id", 1).single()
      ]);
      if (bonnosError || displayError) {
        console.error(bonnosError || displayError);
        return;
      }
      appState.bonnos = bonnos || [];
      appState.displayState = display;
      appState.currentBonno = display?.current_bonno_id ? appState.bonnos.find(b => b.id === display.current_bonno_id) || null : null;
    }

    async function loadDisplayData() {
      const db = initClient();
      if (!db) return;
      const { data: display, error } = await db.from("display_state").select("*").eq("id", 1).single();
      if (error) {
        console.error(error);
        return;
      }
      appState.displayState = display;
      if (display?.current_bonno_id) {
        const { data: bonno, error: bonnoError } = await db.from("bonnos").select("*").eq("id", display.current_bonno_id).single();
        if (bonnoError) console.error(bonnoError);
        appState.currentBonno = bonno || null;
      } else {
        appState.currentBonno = null;
      }
    }

    function renderScreen() {
      document.body.className = "screen-body";
      const current = appState.currentBonno;
      const mode = appState.displayState?.mode || "idle";
      const isBurning = mode === "burning";
      const isFinished = mode === "finished";

      root.innerHTML = `
        <main class="screen-card">
          ${isConfigured() ? "" : setupWarning()}
          <div class="screen-label">${isFinished ? "供養完了" : "ただいまの煩悩"}</div>
          <div id="screen-text" class="screen-text ${isBurning ? "burning-text" : ""}">
            ${escapeHtml(current?.text || "煩悩を選択してください")}
          </div>
          <div class="screen-meta">
            ${current ? `カテゴリ：${escapeHtml(current.category || "未分類")}　投稿：${escapeHtml(current.nickname || "匿名")}` : "運営画面から表示する煩悩を選んでください"}
          </div>
          <div id="purified" class="purified ${isFinished ? "show" : isBurning ? "show" : ""}">浄化されました</div>
        </main>
        <div class="flame ${isBurning ? "active" : ""}"></div>
      `;
    }

    function subscribeRealtime() {
      const db = initClient();
      if (!db) return;
      db.channel("bonno-auction-realtime")
        .on("postgres_changes", { event: "*", schema: "public", table: "bonnos" }, async () => {
          if (route === "admin") { await loadAdminData(); renderAdmin(); }
          if (route === "screen") { await loadDisplayData(); renderScreen(); }
        })
        .on("postgres_changes", { event: "*", schema: "public", table: "display_state" }, async () => {
          if (route === "admin") { await loadAdminData(); renderAdmin(); }
          if (route === "screen") { await loadDisplayData(); renderScreen(); }
        })
        .subscribe();
    }

    async function start() {
      if (route === "home") return renderHome();
      if (route === "submit") return renderSubmit();
      if (route === "admin") {
        if (isConfigured()) await loadAdminData();
        renderAdmin();
        subscribeRealtime();
        return;
      }
      if (route === "screen") {
        if (isConfigured()) await loadDisplayData();
        renderScreen();
        subscribeRealtime();
        return;
      }
    }

    start();
  </script>
</body>
</html>
